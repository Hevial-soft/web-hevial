version: '3.9'

services:
  frontend:
    build: ./frontend
    container_name: hevial-frontend

  nginx:
    build: ./frontend
    container_name: hevial-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    container_name: hevial-backend
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy  # Ждем пока БД будет готова

  db:
    image: postgres:16
    container_name: hevial-db
    restart: always
    environment:
      POSTGRES_DB: hevial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hevial_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: