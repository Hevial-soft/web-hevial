version: '3.9'

services:
  frontend:
    build: ./frontend
    container_name: hevial-frontend

  nginx:
    build: ./frontend 
    container_name: hevial-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    container_name: hevial-backend
    ports:
      - "5001:5000"